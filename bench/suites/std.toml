# ddb-tilers benchmark suite: std
# Standard comparison suite: medium to large rasters and point clouds, edge cases included; the one every recorded comparison uses.
#
# Read by the harness (bench/harness). The corpus items (path, sha256, tile zoom range, probe) come from
# the manifest written by scripts/corpus-manifest.py; this file only picks ids and the scenario matrix.
# The matrix values are placeholders: the harness profiles (bench/harness/profiles.toml) narrow them.

[suite]
name = "std"
description = "Standard comparison suite: medium to large rasters and point clouds, edge cases included; the one every recorded comparison uses."
corpus_manifest = "/mnt/data/ddb-tilers-work/corpus/manifest.json"
items = ["R1", "R2", "R3", "R4", "R5", "R7", "R10", "E1", "E2", "P1", "P2", "P3", "P4", "E3", "E5"]

# Scenario matrix (placeholders): tile runs take the product of these axes; build runs ignore tile_sizes,
# formats and cache and take "threads" as the build thread cap where the builder has one.
[matrix]
threads = [1, 4, 8, 16, 32]
formats = ["png", "jpeg", "webp"]
tile_sizes = [256, 512]
cache = ["cold", "warm"]

# Scenario families (placeholders): per-zoom sweeps, 1920 x 1080 pan walks, 512 px retina tiles, edge tiles.
[scenarios]
tile_requests = ["sweep-per-zoom", "pan-walk-1920x1080", "retina-512", "edge-tiles"]
builds = ["cog", "copc-untwine", "copc-pdal"]

# Baseline backend: official DroneDB 2.4.1 (a frozen snapshot of its binaries); the candidate is selected by the harness.
[baseline]
env_file = "/mnt/data/ddb-tilers-work/baseline/baseline.env"
manifest = "/mnt/data/ddb-tilers-work/baseline/MANIFEST.json"
forceRecreate = false
fresh_ddb_home_per_scenario = true

# Operations the baseline cannot serve for an item (the harness skips them)
[item.R4]
tile = false
build = false
note = "Not georeferenced (no CRS, no geotransform): DDBMemoryTileFmt fails with \"not a GeoImage\" and a COG build fails with \"no coordinate reference system\". Use it for reader, stretch and band tests, not for tile or build timings."

[item.E3]
tile = false
note = "Header says EPSG:4978 but the coordinates are local (about -100..300 m): the footprint lands far outside the EPSG:3857 world (y about 2.4e8 m). Measured on 2.4.1: the COPC build works, and tiling writes tiles at rows far beyond 2^z. Not a meaningful tile set: build only."
